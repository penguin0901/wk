<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>密码访问</title>
    <style>
        body{
            text-align:center; margin-top:100px; font-size:20px;
        }
        input{
            padding:10px; font-size:18px; width:200px;
        }
        button{
            padding:10px 20px; font-size:18px;
        }
    </style>
</head>
<body>
    <h1>输入密码才可访问</h1>
    <br>
    <input type="password" id="pwd" placeholder="请输入密码">
    <button onclick="check()">确认</button>

    <script>
        function check(){
            let password = document.getElementById('pwd').value;
            if(password === '13691'){
                window.location.href = 'https://penguin0901.github.io/wk/index2.html';
            }else{
                alert('密码错误！');
            }
        }
    </script>
</body>
</html>
